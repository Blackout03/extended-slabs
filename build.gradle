plugins {
	id 'java-library'
	id 'eclipse'
	id 'idea'
	id 'maven-publish'
	id 'net.neoforged.gradle.userdev' version '7.0.116'
}

version = "${minecraftVersion}-${modVersion}"
group = 'com.blackout'
base.archivesName = modId

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

runs {
	configureEach {
		systemProperty "forge.logging.markers", "SCAN,REGISTRIES,REGISTRYDUMP"
		systemProperty "forge.logging.console.level","debug"
		modSource project.sourceSets.main
	}

	client {
		programArguments = ['--username', "Blackout${new Random().nextInt(1000)}"]
	}

	server {
		programArgument "--nogui"
	}

	data {
		programArguments.addAll "--mod",
				project.modId, "--all",
				"--output",
				file("src/main/generated/").getAbsolutePath(),
				"--existing",
				file("src/main/resources/").getAbsolutePath()
	}
}

sourceSets.main.resources { srcDir 'src/main/generated' }

dependencies {
	implementation "net.neoforged:neoforge:${neoVersion}"

//	implementation fg.deobf("mezz.jei:jei-${minecraftVersion}-common-api:${jeiVersion}")
//	implementation fg.deobf("mezz.jei:jei-${minecraftVersion}-forge-api:${jeiVersion}")
//	implementation fg.deobf("mezz.jei:jei-${minecraftVersion}-forge:${jeiVersion}")
//	implementation fg.deobf("curse.maven:just-enough-resources-jer-240630:${jerVersion}")

//	implementation fg.deobf("curse.maven:configured-457570:${configuredVersion}")
//	implementation fg.deobf("curse.maven:catalogue-459701:${catalogueVersion}")

//	implementation fg.deobf("curse.maven:the-one-probe-245211:${topVersion}")
}

publishing {
	publications {
		register('mavenJava', MavenPublication) {
			from components.java
		}
	}
	repositories {
		maven {
			url "file://${project.projectDir}/repo"
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

processResources {
	exclude '**/.cache/'

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
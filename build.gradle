plugins {
	id 'eclipse'
	id 'idea'
	id 'maven-publish'
}

subprojects {
	apply plugin: 'java-library'
	apply plugin: 'maven-publish'

	version = "${minecraftVersion}-${modVersion}"
	group = 'com.blackout.extendedslabs'
	base.archivesName = "${modId}-${project.name}"

	java.toolchain.languageVersion = JavaLanguageVersion.of(21)

	repositories {
		mavenCentral()
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven {
			name = 'NeoForged'
			url = 'https://maven.neoforged.net/releases'
		}
		maven {
			name = 'Parchment'
			url = 'https://maven.parchmentmc.org'
		}
		maven {
			name = 'CurseForge'
			url = 'https://www.cursemaven.com'
		}
		maven {
			name = 'Progwml6 maven'
			url = 'https://dvs1.progwml6.com/files/maven/'
		}
		maven {
			name = 'ModMaven'
			url = 'https://modmaven.k-4u.nl'
		}
	}

	tasks.withType(JavaCompile).configureEach {
		options.encoding = 'UTF-8'
		options.release = 21
	}

	tasks.withType(ProcessResources).configureEach {
		var replaceProperties = [
				minecraftVersion: minecraftVersion,
				minecraftVersionRange: minecraftVersionRange,
				neoVersion: neoVersion,
				neoVersionRange: neoVersionRange,
				neoLoaderVersionRange: neoLoaderVersionRange,
				fabricLoaderVersion: fabricLoaderVersion,
				fabricApiVersion: fabricApiVersion,
				modId: modId,
				modName: modName,
				modLicense: modLicense,
				modVersion: modVersion,
				modAuthor: modAuthor,
				modDescription: modDescription,
				packVersion: packVersion,
		]

		inputs.properties replaceProperties

		filesMatching(['fabric.mod.json', 'META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
			expand replaceProperties
		}

		exclude '**/.cache/'
		duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	}
}

import java.util.concurrent.BlockingQueue
import java.util.concurrent.LinkedBlockingQueue
import java.util.concurrent.TimeUnit

plugins {
	id 'eclipse'
	id 'idea'
	id 'maven-publish'
}

def combinedRunLogDirectory = layout.buildDirectory.dir('runBothClients/logs')

def ansiColor = { String hex ->
	String value = hex.startsWith('#') ? hex.substring(1) : hex

	if (!(value ==~ /[0-9A-Fa-f]{6}/)) {
		throw new GradleException("Invalid RGB hex colour: ${hex}")
	}

	int red = Integer.parseInt(value.substring(0, 2), 16)
	int green = Integer.parseInt(value.substring(2, 4), 16)
	int blue = Integer.parseInt(value.substring(4, 6), 16)

	return "\u001B[38;2;${red};${green};${blue}m"
}

def platformColors = [
		'Fabric'  : ansiColor('#00FFFF'),
		'NeoForge': ansiColor('#FF8800')
].asImmutable()

def resetColor = '\u001B[0m'
def bracketGrey = ansiColor('#808080')
def messageWhite = ansiColor('#FFFFFF')
def timeGreen = ansiColor('#238636')
def infoBlue = ansiColor('#58A6FF')
def warningOrange = ansiColor('#FFA845')
def errorRed = ansiColor('#F85149')
def extendedSlabsColor = ansiColor('#D4BF50')
def datagenColor = ansiColor('#6F5A8F')

def datagenProviderColors = [
		'Blockstates'     : ansiColor('#55B996'),
		'Block Tags'      : ansiColor('#9EB955'),
		'Copper Data Maps': ansiColor('#B96A55')
].asImmutable()

def colorizeDatagenMessage = { String message ->
	def providerMatcher = message =~ /^\s*\[Datagen\/(Blockstates|Block Tags|Copper Data Maps)]\s*(.*)\u0024/

	if (providerMatcher.matches()) {
		String provider = providerMatcher.group(1)
		String remainder = providerMatcher.group(2)
		String providerColor = datagenProviderColors.getOrDefault(provider, messageWhite)

		return "${bracketGrey}[${datagenColor}Datagen${bracketGrey}/${providerColor}${provider}${bracketGrey}] " +
				"${messageWhite}${remainder}"
	}

	def datagenMatcher = message =~ /^\s*\[Datagen]\s*(.*)\u0024/

	if (datagenMatcher.matches()) {
		return "${bracketGrey}[${datagenColor}Datagen${bracketGrey}] " +
				"${messageWhite}${datagenMatcher.group(1)}"
	}

	return "${messageWhite}${message}"
}

def colorizeExtendedSlabsMessage = { String remainder ->
	def loggerMatcher = remainder =~ /^\s*(?:\[(?i:(?:co\.bl\.ex\.)?extendedslabs)\/?]|\((?i:(?:co\.bl\.ex\.)?extendedslabs)\))\s*:?\s*(.*)\u0024/

	if (!loggerMatcher.matches()) {
		return "${messageWhite}${remainder}"
	}

	String message = colorizeDatagenMessage(loggerMatcher.group(1))

	return " ${bracketGrey}[${extendedSlabsColor}ExtendedSlabs${bracketGrey}] " +
			"${messageWhite}${message}"
}

def colorizeMinecraftLogLine = { String line ->
	def matcher = line =~ /^\[(\d{2}:\d{2}:\d{2})] \[([^]]+)\/(INFO|WARN|ERROR)](.*)\u0024/

	if (!matcher.matches()) {
		return line
	}

	String time = matcher.group(1)
	String thread = matcher.group(2)
	String level = matcher.group(3)
	String remainder = matcher.group(4)

	String levelColor = switch (level) {
		case 'INFO' -> infoBlue
		case 'WARN' -> warningOrange
		case 'ERROR' -> errorRed
		default -> messageWhite
	}

	String coloredMessage = colorizeExtendedSlabsMessage(remainder)

	return "${bracketGrey}[${timeGreen}${time}${bracketGrey}] " +
			"${bracketGrey}[${levelColor}${thread}/${level}${bracketGrey}]" +
			"${coloredMessage}${resetColor}"
}

def colorizePlatformLogLine = { String platform, String line ->
	String platformColor = platformColors.getOrDefault(platform, messageWhite)
	String coloredLine = colorizeMinecraftLogLine(line)

	return "${bracketGrey}[${platformColor}${platform}${bracketGrey}] " +
			"${messageWhite}${coloredLine}${resetColor}"
}

tasks.register('logNeoForge') {
	group = 'mod development'
	description = 'Displays the saved NeoForge client output.'

	doLast {
		File logFile = combinedRunLogDirectory.get().file('neoforge.log').asFile

		if (!logFile.exists()) {
			logger.lifecycle('No NeoForge log was generated.')
			return
		}

		logFile.eachLine('UTF-8') { line ->
			logger.lifecycle(colorizePlatformLogLine('NeoForge', line))
		}
	}
}

tasks.register('logFabric') {
	group = 'mod development'
	description = 'Displays the saved Fabric client output.'

	mustRunAfter tasks.named('logNeoForge')

	doLast {
		File logFile = combinedRunLogDirectory.get().file('fabric.log').asFile

		if (!logFile.exists()) {
			logger.lifecycle('No Fabric log was generated.')
			return
		}

		logFile.eachLine('UTF-8') { line ->
			logger.lifecycle(colorizePlatformLogLine('Fabric', line))
		}
	}
}

tasks.register('runNeoForgeData') {
	group = 'mod development'
	description = 'Runs NeoForge client data generation with colored console output.'

	doLast {
		boolean isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
		String gradleCommand = isWindows
				? new File(rootDir, 'gradlew.bat').absolutePath
				: new File(rootDir, 'gradlew').absolutePath
		String javaHome = System.getProperty('java.home')
		Process process = null

		try {
			ProcessBuilder processBuilder = new ProcessBuilder(
					gradleCommand,
					':neoforge:runClientData',
					'--console=plain',
					'--no-daemon'
			)
					.directory(rootDir)
					.redirectErrorStream(true)

			Map<String, String> environment = processBuilder.environment()
			environment.put('JAVA_HOME', javaHome)
			environment.put(
					'PATH',
					new File(javaHome, 'bin').absolutePath
							+ File.pathSeparator
							+ environment.getOrDefault('PATH', '')
			)

			process = processBuilder.start()

			process.inputStream.withReader { reader ->
				reader.eachLine { line ->
					logger.lifecycle(colorizePlatformLogLine('NeoForge', line))
				}
			}

			int exitCode = process.waitFor()

			if (exitCode != 0) {
				throw new GradleException("NeoForge data generation exited unsuccessfully: ${exitCode}")
			}
		} finally {
			if (process != null && process.isAlive()) {
				if (isWindows) {
					Process treeKiller = new ProcessBuilder(
							'taskkill',
							'/PID',
							Long.toString(process.pid()),
							'/T',
							'/F'
					)
							.redirectErrorStream(true)
							.start()

					treeKiller.inputStream.transferTo(OutputStream.nullOutputStream())
					treeKiller.waitFor()
				} else {
					List<ProcessHandle> descendants = process.toHandle()
							.descendants()
							.toList()
							.reverse()

					descendants.each { descendant ->
						descendant.destroy()
					}

					descendants.findAll { descendant ->
						descendant.isAlive()
					}.each { descendant ->
						descendant.destroyForcibly()
					}

					process.destroyForcibly()
				}
			}
		}
	}
}

tasks.register('runBothClients') {
	group = 'mod development'
	description = 'Runs Fabric and NeoForge with combined live console output.'

	doLast {
		boolean isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
		String gradleCommand = isWindows
				? new File(rootDir, 'gradlew.bat').absolutePath
				: new File(rootDir, 'gradlew').absolutePath

		File logDirectory = combinedRunLogDirectory.get().asFile
		logDirectory.mkdirs()

		List<Map<String, Object>> clients = [
				[
						name   : 'Fabric',
						task   : ':fabric:runClient',
						logFile: new File(logDirectory, 'fabric.log')
				],
				[
						name   : 'NeoForge',
						task   : ':neoforge:runClient',
						logFile: new File(logDirectory, 'neoforge.log')
				]
		]

		clients.each { client ->
			File logFile = client.logFile as File

			if (logFile.exists()) {
				logFile.delete()
			}

			logFile.createNewFile()
		}

		String javaHome = System.getProperty('java.home')

		List<Process> processes = []
		List<Thread> readerThreads = []
        BlockingQueue<Map<String, String>> outputQueue =
				new LinkedBlockingQueue<>()

		try {
			clients.each { client ->
				ProcessBuilder processBuilder = new ProcessBuilder(
						gradleCommand,
						client.task,
						'--console=plain',
						'--no-daemon'
				)
						.directory(rootDir)
						.redirectErrorStream(true)

				Map<String, String> environment = processBuilder.environment()
				environment.put('JAVA_HOME', javaHome)
				environment.put(
						'PATH',
						new File(javaHome, 'bin').absolutePath
								+ File.pathSeparator
								+ environment.getOrDefault('PATH', '')
				)

				Process process = processBuilder.start()
				processes.add(process)

				Thread readerThread = Thread.start("${client.name}-console-reader") {
					File logFile = client.logFile as File

					try {
						logFile.withWriter('UTF-8') { writer ->
							process.inputStream.withReader { reader ->
								reader.eachLine { line ->
									writer.write(line)
									writer.newLine()
									writer.flush()

									outputQueue.put([
											name: client.name as String,
											line: line
									])
								}
							}
						}
					} catch (InterruptedException ignored) {
						currentThread().interrupt()
					} catch (IOException exception) {
						String errorMessage = "Console reader failed: ${exception.message}"

						logFile.withWriterAppend('UTF-8') { writer ->
							writer.write(errorMessage)
							writer.newLine()
							writer.flush()
						}

						outputQueue.offer([
								name: client.name as String,
								line: errorMessage
						])
					}
				}

				readerThreads.add(readerThread)
			}

			while (processes.any { process -> process.isAlive() } || !outputQueue.isEmpty()) {
				Map<String, String> message = outputQueue.poll(
						100,
                        TimeUnit.MILLISECONDS
				)

				if (message != null) {
					logger.lifecycle(colorizePlatformLogLine(message.name, message.line))
				}
			}

			readerThreads.each { thread ->
				thread.join()
			}

			while (!outputQueue.isEmpty()) {
				Map<String, String> message = outputQueue.poll()
				logger.lifecycle(colorizePlatformLogLine(message.name, message.line))
			}

			List<Integer> exitCodes = processes.collect { process ->
				process.exitValue()
			}

			if (exitCodes.any { exitCode -> exitCode != 0 }) {
				throw new GradleException("One or more clients exited unsuccessfully: ${exitCodes}")
			}
		} finally {
			readerThreads.each { thread ->
				thread.interrupt()
			}

			processes.each { process ->
				if (!process.isAlive()) {
					return
				}

				if (isWindows) {
					Process treeKiller = new ProcessBuilder(
							'taskkill',
							'/PID',
							Long.toString(process.pid()),
							'/T',
							'/F'
					)
							.redirectErrorStream(true)
							.start()

					treeKiller.inputStream.transferTo(OutputStream.nullOutputStream())
					treeKiller.waitFor()
				} else {
					List<ProcessHandle> descendants = process.toHandle()
							.descendants()
							.toList()
							.reverse()

					descendants.each { descendant ->
						descendant.destroy()
					}

					descendants.findAll { descendant ->
						descendant.isAlive()
					}.each { descendant ->
						descendant.destroyForcibly()
					}

					process.destroyForcibly()
				}
			}
		}
	}
}

tasks.named('runBothClients') {
	finalizedBy tasks.named('logNeoForge')
	finalizedBy tasks.named('logFabric')
}

subprojects {
	apply plugin: 'java-library'
	apply plugin: 'maven-publish'

	repositories {
		maven {
			name = "Jared's maven"
			url = "https://maven.blamejared.com/"
		}
		maven {
			name = "ModMaven"
			url = "https://modmaven.dev"
		}
	}

	version = "${minecraftVersion}-${modVersion}"
	group = 'com.blackout.extendedslabs'
	base.archivesName = "${modId}-${project.name}"

	java.toolchain.languageVersion = JavaLanguageVersion.of(26)

	tasks.withType(JavaCompile).configureEach {
		options.encoding = 'UTF-8'
		options.release = 26
	}

	tasks.withType(ProcessResources).configureEach {
		var replaceProperties = [
				minecraftVersion: minecraftVersion,
				minecraftVersionRange: minecraftVersionRange,
				neoVersion: neoVersion,
				neoVersionRange: neoVersionRange,
				fabricLoaderVersion: fabricLoaderVersion,
				fabricApiVersion: fabricApiVersion,
				jeiVersion: jeiVersion,
				modId: modId,
				modName: modName,
				modLicense: modLicense,
				modVersion: modVersion,
				modAuthor: modAuthor,
				modDescription: modDescription,
				packVersion: packVersion,
		]

		inputs.properties replaceProperties

		filesMatching(['fabric.mod.json', 'META-INF/neoforge.mods.toml', 'pack.mcmeta', 'extendedslabs.properties']) {
			expand replaceProperties
		}

		exclude '**/.cache/'
		duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	}
}

plugins {
	id 'eclipse'
	id 'idea'
	id 'maven-publish'
}

tasks.register('runBothClients') {
	group = 'mod development'
	description = 'Runs the Fabric and NeoForge clients with combined console output.'

	doLast {
		String gradleCommand = System.getProperty('os.name').toLowerCase().contains('windows')
				? new File(rootDir, 'gradlew.bat').absolutePath
				: new File(rootDir, 'gradlew').absolutePath

		List<Map<String, Object>> clients = [
				[name: 'Fabric', task: ':fabric:runClient'],
				[name: 'NeoForge', task: ':neoforge:runClient']
		]

		List<Process> processes = []
		List<Thread> outputThreads = []

		Map<String, String> clientColors = [
				'Fabric'  : '\u001B[38;5;51m',
				'NeoForge': '\u001B[38;5;208m'
		]
		String resetColor = '\u001B[0m'

		try {
			clients.each { client ->
				ProcessBuilder processBuilder = new ProcessBuilder(
						gradleCommand,
						client.task as String,
						'--console=plain',
						'--no-daemon'
				)
						.directory(rootDir)
						.redirectErrorStream(true)

				String javaHome = System.getProperty('java.home')
				Map<String, String> environment = processBuilder.environment()
				environment.put('JAVA_HOME', javaHome)
				environment.put('PATH', new File(javaHome, 'bin').absolutePath + File.pathSeparator + environment.getOrDefault('PATH', ''))

				Process process = processBuilder.start()

				processes.add(process)
				outputThreads.add(Thread.start {
					process.inputStream.withReader { reader ->
						reader.eachLine { line ->
							String clientColor = clientColors.getOrDefault(client.name as String, '')
							println "[${clientColor}${client.name}${resetColor}] ${line}"
						}
					}
				})
			}

			List<Integer> exitCodes = processes.collect { process ->
				process.waitFor()
			}

			outputThreads.each { thread ->
				thread.join()
			}

			if (exitCodes.any { exitCode -> exitCode != 0 }) {
				throw new GradleException("One or more clients exited unsuccessfully: ${exitCodes}")
			}
		} finally {
			processes.each { process ->
				if (System.getProperty('os.name').toLowerCase().contains('windows')) {
					if (process.isAlive()) {
						Process treeKiller = new ProcessBuilder(
								'taskkill',
								'/PID',
								Long.toString(process.pid()),
								'/T',
								'/F'
						)
								.redirectErrorStream(true)
								.start()

						treeKiller.inputStream.transferTo(OutputStream.nullOutputStream())
						treeKiller.waitFor()
					}
				} else {
					List<ProcessHandle> descendants = process.toHandle()
							.descendants()
							.toList()
							.reverse()

					descendants.each { descendant ->
						descendant.destroy()
					}

					descendants.findAll { descendant -> descendant.isAlive() }.each { descendant ->
						descendant.destroyForcibly()
					}

					if (process.isAlive()) {
						process.destroyForcibly()
					}
				}
			}
		}
	}
}

subprojects {
	apply plugin: 'java-library'
	apply plugin: 'maven-publish'

	repositories {
		maven {
			name = "Jared's maven"
			url = "https://maven.blamejared.com/"
		}
		maven {
			name = "ModMaven"
			url = "https://modmaven.dev"
		}
	}

	version = "${minecraftVersion}-${modVersion}"
	group = 'com.blackout.extendedslabs'
	base.archivesName = "${modId}-${project.name}"

	java.toolchain.languageVersion = JavaLanguageVersion.of(26)

	tasks.withType(JavaCompile).configureEach {
		options.encoding = 'UTF-8'
		options.release = 26
	}

	tasks.withType(ProcessResources).configureEach {
		var replaceProperties = [
				minecraftVersion: minecraftVersion,
				minecraftVersionRange: minecraftVersionRange,
				neoVersion: neoVersion,
				neoVersionRange: neoVersionRange,
				fabricLoaderVersion: fabricLoaderVersion,
				fabricApiVersion: fabricApiVersion,
				jeiVersion: jeiVersion,
				modId: modId,
				modName: modName,
				modLicense: modLicense,
				modVersion: modVersion,
				modAuthor: modAuthor,
				modDescription: modDescription,
				packVersion: packVersion,
		]

		inputs.properties replaceProperties

		filesMatching(['fabric.mod.json', 'META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
			expand replaceProperties
		}

		exclude '**/.cache/'
		duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	}
}

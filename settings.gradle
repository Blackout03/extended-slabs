pluginManagement {
	repositories {
		gradlePluginPortal()
		mavenCentral()
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven {
			name = 'NeoForged'
			url = 'https://maven.neoforged.net/releases'
		}
		maven {
			name = 'Parchment'
			url = 'https://maven.parchmentmc.org'
		}
	}
}

plugins {
	id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

dependencyResolutionManagement {
	repositories {
		mavenCentral()
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven {
			name = 'NeoForged'
			url = 'https://maven.neoforged.net/releases'
		}
		maven {
			name = 'Parchment'
			url = 'https://maven.parchmentmc.org'
		}
		maven {
			name = 'CurseForge'
			url = 'https://www.cursemaven.com'
		}
	}
}

rootProject.name = 'extended-slabs'

include 'common'
include 'fabric'
include 'neoforge'
